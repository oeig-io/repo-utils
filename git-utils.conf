# Git utilities configuration

# Delimiter used to separate output sections
DELIMITER="==="

# Organization that owns the canonical repos. git-status-all.sh highlights any
# repo whose origin points elsewhere (e.g. a personal fork) so it stands out.
EXPECTED_ORG="oeig-io"

# Per-repo home-branch overrides for git-status-all.sh. Use for external repos
# that intentionally track a non-default branch (e.g. a pinned release). Key =
# directory name, value = the branch that should count as "home". When a repo is
# not listed, home base is the remote's default branch (main/master). "Off home
# base" is only flagged red when the current branch differs from this value.
declare -A EXPECTED_BRANCH=(
    [idempiere-core]="release-13"
)

# ANSI color codes
COLOR_INFO=$(tput setaf 6)    # Cyan
COLOR_SUCCESS=$(tput setaf 2) # Green
COLOR_WARNING=$(tput setaf 3) # Yellow
COLOR_CHANGES=$(tput setaf 1) # Red
COLOR_RESET=$(tput sgr0)

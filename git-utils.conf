# Git utilities configuration

# Delimiter used to separate output sections
DELIMITER="==="

# Organization that owns the canonical repos. git-status-all.sh highlights any
# repo whose origin points elsewhere (e.g. a personal fork) so it stands out.
EXPECTED_ORG="oeig-io"

# Per-repo home-ref overrides for git-status-all.sh. Use for external repos
# whose reference point is not the remote's default branch: one tracking a
# non-default branch (idempiere-core on release-13) or pinned to an upstream
# release tag via `git switch --detach <tag>` (netbird at v0.76.3). Key =
# directory name, value = the branch or tag that should count as "home".
# When a repo is not listed, home base is the remote's default branch
# (main/master). "Off home base" is only flagged red when the current branch
# differs from this value. A tag home base also reports informationally
# (cyan) how far the default branch has moved past the pin.
declare -A EXPECTED_REF=(
    [idempiere-core]="release-13"
    [netbird]="v0.76.3"
)

# ANSI color codes
COLOR_INFO=$(tput setaf 6)    # Cyan
COLOR_SUCCESS=$(tput setaf 2) # Green
COLOR_WARNING=$(tput setaf 3) # Yellow
COLOR_CHANGES=$(tput setaf 1) # Red
# Blue — used for the org label on repos whose origin is not EXPECTED_ORG.
# Deliberately NOT yellow, so the label doesn't read like the [ahead]/[behind]
# tracking warning. The `=== section ===` header stays cyan (COLOR_INFO); the
# non-EXPECTED_ORG label is the only thing colored with COLOR_FORK.
COLOR_FORK=$(tput setaf 4)
COLOR_RESET=$(tput sgr0)

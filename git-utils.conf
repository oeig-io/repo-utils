# Git utilities configuration

# Delimiter used to separate output sections
DELIMITER="==="

# Organization that owns the canonical repos. git-status-all.sh highlights any
# repo whose origin points elsewhere (e.g. a personal fork) so it stands out.
EXPECTED_ORG="oeig-io"

# Per-repo home-ref overrides for git-status-all.sh. Use for external repos
# whose reference point is not the remote's default branch: one tracking a
# non-default branch (idempiere-core on release-13) or pinned to an upstream
# release tag via `git switch --detach <tag>` (netbird at v0.76.3). Key =
# directory name, value = the branch, tag, or commit hash that should count
# as "home". When a repo is not listed, home base is the remote's default
# branch (main/master). "Off home base" is only flagged red when the current
# branch differs from this value. A tag home base also reports informationally
# (cyan) how far the default branch has moved past the pin.
#
# Pinning an untagged companion repo to a tagged release. When a repo is
# pinned to a release tag but a companion repo upstream cuts no tags (docs
# sites are commonly versionless), pin the companion by commit hash instead:
#
#   1. Detach at the commit current when the tagged pin was made:
#        git switch --detach <full-commit-hash>
#   2. Move forward past that commit ONLY for retroactive fixes to already-
#      released content — anything describing a newer release is out of scope.
#   3. Record the full hash here as the repo's EXPECTED_REF value.
#
# To keep the two pins in step, re-run steps 1-2 for the companion every time
# the tagged repo's pin is bumped. A hash home base matches by commit (not
# name), so it reads clean but gets no "pinned; N ahead" staleness signal —
# staleness shows only when the tag owner is bumped.
declare -A EXPECTED_REF=(
    [idempiere-core]="release-13"
    [netbird]="v0.76.3"
    # netbird-docs: commit current at the v0.76.3 pin date, plus three days of retroactive v0.76.x doc fixes (incl. Traefik reverse proxy).
    [netbird-docs]="204c2793f3431a5e4acd34afdd19207aa5d21562"
)

# ANSI color codes
COLOR_INFO=$(tput setaf 6)    # Cyan
COLOR_SUCCESS=$(tput setaf 2) # Green
COLOR_WARNING=$(tput setaf 3) # Yellow
COLOR_CHANGES=$(tput setaf 1) # Red
# Blue — used for the org label on repos whose origin is not EXPECTED_ORG.
# Deliberately NOT yellow, so the label doesn't read like the [ahead]/[behind]
# tracking warning. The `=== section ===` header stays cyan (COLOR_INFO); the
# non-EXPECTED_ORG label is the only thing colored with COLOR_FORK.
COLOR_FORK=$(tput setaf 4)
COLOR_RESET=$(tput sgr0)
